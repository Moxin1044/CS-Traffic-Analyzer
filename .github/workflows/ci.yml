name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile extract_private_key.py extract_session_keys.py cs_traffic_report.py cs_traffic_gui.py
      - run: python -c "import tkinter; print(tkinter.TkVersion)"

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CS-Traffic-Analyzer cs_traffic_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: CS-Traffic-Analyzer-windows
          path: dist/CS-Traffic-Analyzer.exe
