name: CI / Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile extract_private_key.py extract_session_keys.py cs_traffic_report.py cs_traffic_gui.py
      - run: python -c "import tkinter; print(tkinter.TkVersion)"

  build-windows:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CS-Traffic-Analyzer-${{ github.ref_name }}-windows-x64 cs_traffic_gui.py
      - uses: actions/upload-artifact@v5
        with:
          name: CS-Traffic-Analyzer-windows
          path: dist/CS-Traffic-Analyzer-*-windows-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/CS-Traffic-Analyzer-*-windows-x64.exe
